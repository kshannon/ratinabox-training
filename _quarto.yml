project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - about.qmd
    # The complete module notebooks ARE the training content (prose + code + folded answers).
    - notebooks/module_*.ipynb
    # Student versions are generated by scripts/make_student_notebooks.py for download /
    # Colab only — they must not become pages (they'd duplicate the module, minus answers).
    - "!notebooks/*_student.ipynb"

# Execute every code cell at build time, so the site shows real figures and output.
# Notebooks are committed with outputs stripped (nbstripout), so this is what produces them.
# Consequence worth keeping: if the site builds, the code runs. The build IS the test.
execute:
  enabled: true
  freeze: auto # re-execute only what changed locally; CI has no cache, so CI always runs fresh

website:
  title: "RatInABox — Lab Training"
  description: "Learn to use RatInABox python library for neural synthetic-data generation."
  # Published by .github/workflows/ci.yml on every push to main.
  site-url: https://kshannon.github.io/ratinabox-training/
  repo-url: https://github.com/kshannon/ratinabox-training
  reader-mode: true
  search:
    location: sidebar
    type: overlay
  page-navigation: true
  navbar:
    left:
      - text: "Start here"
        href: index.qmd
      - text: "Modules"
        href: notebooks/module_1.ipynb
      - text: "About"
        href: about.qmd
    tools:
      - icon: github
        href: https://github.com/RatInABox-Lab/RatInABox
        text: "RatInABox on GitHub"
  sidebar:
    style: docked
    collapse-level: 2
    contents:
      - text: "Start here"
        href: index.qmd
      - section: "Modules"
        contents:
          - text: "1 · Environments & Agents"
            href: notebooks/module_1.ipynb
      - text: "About"
        href: about.qmd
  page-footer:
    left: "Kyle Shannon"
    right: "RatInABox Training"

format:
  html:
    theme:
      light: flatly
      dark: darkly
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    grid:
      sidebar-width: 320px
